[package]
name = "o1-verifier-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "o1zkvm"
path = "src/main.rs"

[dependencies]
sp1-sdk = { workspace = true, features = ["cuda", "network"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
# Host-side construction of the VerifiableProof from a fixture directory
# (`wire::parse_*` + `convert::OcamlProof::into_verifiable`).
pickles-verifier = { path = "../pickles-verifier" }

[build-dependencies]
sp1-build = { workspace = true }

[features]
default = []
# Opt-in: enable sp1-sdk's sampling profiler. Forces the portable executor
# (the JIT path is gated off when profiling is on), so only turn this on
# for `make rust-e2e-tests-profile` runs.
profiling = ["sp1-sdk/profiling"]
