[package]
name = "pickles-fetch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pickles-fetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
anyhow = "1"
base64 = "0.22"
